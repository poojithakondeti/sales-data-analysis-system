
{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card">
        <div class="card-header">
            <h4>Edit Product</h4>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text"
                           name="product_name"
                           class="form-control"
                           value="{{ product.product_name }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input type="text"
                           name="category"
                           class="form-control"
                           value="{{ product.category }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Price (₹)</label>
                    <input type="number"
                           name="price"
                           class="form-control"
                           value="{{ product.price }}"
                           min="0"
                           step="0.01"
                           required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Update Product
                </button>

                <a href="{{ url_for('products') }}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
