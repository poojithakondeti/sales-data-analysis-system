<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div class="container py-5"><div class="card shadow-sm mx-auto" style="max-width:430px"><div class="card-body p-4"><h2>Administrator Login</h2><p class="text-muted">Sign in to manage products, stock and customer orders.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="POST"><div class="mb-3"><label class="form-label">Admin Username</label><input class="form-control" name="username" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div><button class="btn btn-primary w-100">Admin Login</button></form><p class="mt-3 mb-0 text-center"><a href="{{ url_for('login') }}">User login</a></p></div></div></div></body></html>
